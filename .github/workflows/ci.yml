name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint, format check and tests
        env:
          TERM: xterm
        run: make check

  database-schema:
    name: Migrated schema matches the models (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked runtime and test dependencies
        run: uv sync --locked --extra dev
      - name: Compare the migrated schema with the models
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        # The test skips without a database; a skip here means the job checked nothing.
        shell: bash
        run: |
          uv run --no-sync python -m pytest tests/database -q -rs | tee pytest.log
          grep -q " passed" pytest.log && ! grep -q "skipped" pytest.log

  pydantic-ai-compatibility:
    name: Pydantic AI ${{ matrix.pydantic-ai-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic-ai-version: ["2.38.0", "2.40.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked runtime and test dependencies
        run: uv sync --locked --extra dev
      - name: Exercise real upstream execution in an isolated overlay
        run: >-
          uv run --no-sync
          --with pydantic-ai-slim==${{ matrix.pydantic-ai-version }}
          --with pydantic-graph==${{ matrix.pydantic-ai-version }}
          python -m pytest tests/compatibility -q
      - name: Check optional adapter and Harness imports separately
        run: |
          uv run --no-sync \
            --with 'pydantic-ai-slim[ag-ui,ui]==${{ matrix.pydantic-ai-version }}' \
            --with pydantic-ai-harness==0.29.0 python - <<'PY'
          from pydantic_ai.ui.ag_ui import AGUIAdapter
          from pydantic_ai.ui.vercel_ai import VercelAIAdapter
          from pydantic_ai_harness.compaction import SummarizingCompaction
          from pydantic_ai_harness.memory import Memory
          from pydantic_ai_harness.step_persistence import StepPersistence
          print("Optional imports passed; runtime integration is not asserted.")
          PY
