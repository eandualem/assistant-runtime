[alembic]
script_location = alembic
file_template = %%(year)d%(month).2d%(day).2d_%(hour).2d%(minute).2d%(second).2d_%%(slug)s

# placeholder — overridden by env.py from DatabaseConfig
sqlalchemy.url = postgresql://localhost/lovely_assistant

prepend_sys_path = .

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
