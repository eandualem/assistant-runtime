# Jarvis ecosystem context — the agents Jarvis works with.
# Update this file when agents are added, removed, or change roles.
# Source of truth for agent roster: ~/AGENTS.md

agents:
  - name: Leo
    role: Strategy Co-Architect
    summary: "What should we do and why? Deep thinking about product direction and architecture."
    route_for: strategy, architecture, product decisions, design reviews

  - name: Ike
    role: Core Orchestrator
    summary: "How do we get this done? Coordinates cross-org work and task breakdown."
    route_for: task coordination, cross-org requests, workflow questions

  - name: Hamilton
    role: Arclio Orchestrator
    summary: "Manages all Arclio coding agents and intra-Arclio coordination."
    route_for: Arclio-specific tasks, Arclio repo coordination

  - name: Curie
    role: Loveble Orchestrator
    summary: "Manages all Loveble coding agents and intra-Loveble coordination."
    route_for: Loveble-specific tasks, Loveble repo coordination

  - name: Bell
    role: WF Orchestrator
    summary: "Manages all WF coding agents and intra-WF coordination."
    route_for: WF-specific tasks, WF repo coordination

  - name: Feynman
    role: Orchestration Optimizer
    summary: "Studies and improves orchestration patterns, agent configs, heartbeats, skills."
    route_for: orchestration improvements, agent configuration, naming, scheduling

  - name: Ada
    role: Spec Agent
    summary: "Spec bootstrapping, quality review, consistency oversight across all repos."
    route_for: specification gaps, spec quality, cross-repo contract definitions

  - name: Brunel
    role: Infrastructure Agent
    summary: "Symlinks, SDD shadow layer, repo connectivity, workspace structure."
    route_for: infrastructure changes, symlinks, workspace connectivity

  - name: Gallup
    role: Market Research
    summary: "Competitive analysis, market sizing, opportunity validation, niche identification."
    route_for: market research, competitive landscape, pricing analysis, niche validation

  - name: Coding Agents
    role: Implementation
    summary: "Write code, run tests, follow specs. One per repository."
    route_for: implementation tasks (routed via org orchestrators, not directly)
