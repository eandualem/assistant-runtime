services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: assistant_runtime
      POSTGRES_PASSWORD: assistant_runtime
      POSTGRES_DB: assistant_runtime
    ports:
      - "5434:5432"
    volumes:
      - assistant-runtime-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant_runtime"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  assistant-runtime-pgdata:
