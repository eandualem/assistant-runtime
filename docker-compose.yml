services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lovely_assistant
      POSTGRES_PASSWORD: lovely_assistant
      POSTGRES_DB: lovely_assistant
    ports:
      - "5434:5432"
    volumes:
      - lovely-assistant-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovely_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lovely-assistant-pgdata:
